[project]
name = "kaur-juhtimislaud"
version = "0.1.0"
description = "Inventory of KAUR visualisations and tooling for the KAUR services web page"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    # Renders JS-built <tableau-viz> web components and shadow DOM, which plain HTTP cannot see.
    "playwright>=1.48",
    "polars>=1.44.2",
    "pypdf>=6.19.0",
]

[project.optional-dependencies]
# Only needed for the Tableau Server REST inventory (requires a PAT from the environment).
server = ["tableauserverclient>=0.34"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "ruff>=0.7",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["browser: needs a local Chromium (Playwright)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "N", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Data tables in tests are easier to read as wide rows.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["scratch/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["tableauserverclient", "tableauserverclient.*"]
ignore_missing_imports = true
