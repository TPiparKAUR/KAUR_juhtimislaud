name: Energy analysis (from existing data)

# Builds energy.json from Statistics Estonia tables fetched by "Statistics Estonia fetch" runs
# (artifact statee-raw; tables KE0240, KE033, KE032) and publishes it to `energy-analysis`.

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: "Run ids of successful 'Statistics Estonia fetch' runs, separated by spaces"
        required: true
      eurostat_run_id:
        description: "Optional: run id of an 'Eurostat fetch' run with env_air_gge (greenhouse gases)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: energy-analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Download raw artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.run_ids }}
        run: |
          mkdir -p out/statee
          for id in $RUN_IDS; do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" -n statee-raw -D "out/dl/$id"
            cp -f "out/dl/$id"/*.parquet out/statee/
          done
      - name: Download Eurostat artifact (optional)
        if: ${{ inputs.eurostat_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EUROSTAT_ID: ${{ inputs.eurostat_run_id }}
        run: gh run download "$EUROSTAT_ID" --repo "$GITHUB_REPOSITORY" -n eurostat-raw -D out/eurostat
      - name: Analyse
        run: |
          extra=()
          if [ -d out/eurostat ]; then extra=(--eurostat out/eurostat); fi
          uv run python run_energy.py --raw out/statee --out out/energy "${extra[@]}"
      - name: Publish aggregated results
        run: |
          cp out/energy/energy.json "$RUNNER_TEMP/energy.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan energy-analysis
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/energy.json" energy.json
          git add -- energy.json
          git commit -m "Energy analysis $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin energy-analysis
