name: Yearbooks (public reports) structure

# Downloads the public yearbooks listed in data/allikad.toml from the GitHub runner (the analysis
# sandbox cannot reach these hosts) and publishes only a structural summary (page counts, bookmarks,
# figure/table captions, contents excerpts) to the `yearbooks` branch.  Full PDFs stay in the
# artifact `yearbooks-raw`.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yearbooks-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python fetch_yearbooks.py --sources data/allikad.toml --out out/yearbooks
        timeout-minutes: 25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yearbooks-raw
          path: out/yearbooks/
          retention-days: 30
      - name: Publish summary
        if: always()
        run: |
          cp out/yearbooks/yearbooks_summary.json "$RUNNER_TEMP/yearbooks_summary.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan yearbooks
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/yearbooks_summary.json" yearbooks_summary.json
          git add -- yearbooks_summary.json
          git commit -m "Yearbooks summary $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin yearbooks
