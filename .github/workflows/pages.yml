name: Deploy site

on:
  # Requires Settings -> Pages -> Source = "GitHub Actions".
  push:
    branches: [main]
    paths:
      - build_site.py
      - site_src/**
      - data/**
      - .github/workflows/pages.yml
  workflow_run:
    workflows: ["Climate analysis"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Latest aggregated climate analysis (if published)
        run: |
          if git show origin/climate-results:climate.json > climate.json 2>/dev/null; then
            echo "CLIMATE_ARGS=--climate climate.json" >> "$GITHUB_ENV"
          fi
      - run: uv run python build_site.py --out _site $CLIMATE_ARGS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
