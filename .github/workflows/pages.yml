name: Deploy site

on:
  # Requires Settings -> Pages -> Source = "GitHub Actions".
  push:
    branches: [main]
    paths:
      - build_site.py
      - site_src/**
      - data/**
      - .github/workflows/pages.yml
  workflow_run:
    workflows:
      - "Climate analysis"
      - "Hydrology data (daily)"
      - "Hydrology analysis (from existing daily data)"
      - "Air and energy analysis (from existing data)"
      - "Waste analysis (from existing data)"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Latest aggregated analyses (if published)
        run: |
          args=""
          if git show origin/climate-results:climate.json > climate.json 2>/dev/null; then
            args="$args --climate climate.json"
          fi
          if git show origin/hydro-analysis:hydro.json > hydro.json 2>/dev/null; then
            args="$args --hydro hydro.json"
          fi
          if git show origin/airenergy-analysis:airenergy.json > airenergy.json 2>/dev/null; then
            args="$args --airenergy airenergy.json"
          fi
          if git show origin/waste-analysis:waste.json > waste.json 2>/dev/null; then
            args="$args --waste waste.json"
          fi
          echo "SITE_ARGS=$args" >> "$GITHUB_ENV"
      - run: uv run python build_site.py --out _site $SITE_ARGS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
