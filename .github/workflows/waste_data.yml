name: Waste data (aggregated)

# Streams the national waste-statistics table (f_jaatmeliikumine_fix_riik, ~20 M rows) in ordered
# year x type x group slices and aggregates it while reading.  The aggregate Parquet stays in the
# workflow artifact; only the fetch log (counts, failures, mismatches) goes to `waste-data-log`.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waste-data-log
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python waste_fetch.py --out out/waste_agg
        timeout-minutes: 110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waste-agg
          path: out/waste_agg/
          retention-days: 30
      - name: Publish fetch log
        if: always()
        run: |
          cp out/waste_agg/waste_fetch_log.json "$RUNNER_TEMP/waste_fetch_log.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan waste-data-log
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/waste_fetch_log.json" waste_fetch_log.json
          git add -- waste_fetch_log.json
          git commit -m "Waste data log $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin waste-data-log
