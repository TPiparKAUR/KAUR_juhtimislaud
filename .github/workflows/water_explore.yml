name: Water data

# Reads the water-body register, status assessments, pressures and groundwater status
# (4 small tables) and writes water_diagnostics.json (columns, null shares, years, value counts).
# The Parquet files stay in the artifact `water-raw`; only the diagnostics go to `water-explore`.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaur-api  # one job at a time against the shared public API
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python water_fetch.py --out out/water --workers 3
        timeout-minutes: 25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: water-raw
          path: out/water/
          retention-days: 30
      - name: Publish diagnostics
        if: always()
        run: |
          cp out/water/water_diagnostics.json "$RUNNER_TEMP/water_diagnostics.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan water-explore
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/water_diagnostics.json" water_diagnostics.json
          git add -- water_diagnostics.json
          git commit -m "Water diagnostics $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin water-explore
