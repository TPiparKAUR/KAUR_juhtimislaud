name: Forest analysis (from existing data)

# Re-runs the analysis on the raw SMI Parquet of an earlier "Forest inventory data" run (artifact
# forest-raw) and publishes the aggregated forest.json to `forest-analysis`.
# Raw rows never leave the workflow artifact.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of a successful 'Forest inventory data' run"
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: forest-analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Download raw data artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n forest-raw -D out/forest
      - name: Analyse
        run: uv run python run_forest.py --raw out/forest/forest_raw.parquet --out out/forest
      - name: Publish aggregated results
        run: |
          cp out/forest/forest.json "$RUNNER_TEMP/forest.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan forest-analysis
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/forest.json" forest.json
          git add -- forest.json
          git commit -m "Forest analysis $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin forest-analysis
