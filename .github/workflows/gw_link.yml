name: Groundwater link probe

# Tests whether abstraction intake codes match reserve deposit codes, using the raw tables of an
# earlier "Water use data" run (artifact wateruse-raw). Only match counts are published, to the
# `gw-link` branch.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of a successful 'Water use data' run"
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: gw-link
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Download raw data artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n wateruse-raw -D out/wateruse
      - run: uv run python gw_link.py --raw out/wateruse --out out/gwlink
      - name: Publish counts
        run: |
          cp out/gwlink/gw_link.json "$RUNNER_TEMP/gw_link.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gw-link
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/gw_link.json" gw_link.json
          git add -- gw_link.json
          git commit -m "Groundwater link probe $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin gw-link
