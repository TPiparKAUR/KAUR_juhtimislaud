name: Waste data diagnostics

# Fetches the national waste-statistics table (f_jaatmeliikumine_fix_riik), diagnoses what one
# row means (repeated columns, units, substance groups) and publishes only aggregated diagnostics
# to the `waste-explore` branch.  Raw rows stay in the workflow artifact.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waste-explore
  cancel-in-progress: false

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python waste_explore.py --out out/waste --grain-year 2022
        timeout-minutes: 40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waste-raw
          path: out/waste/
          retention-days: 30
      - name: Publish diagnostics
        if: always()
        run: |
          cp out/waste/diagnostics.json "$RUNNER_TEMP/diagnostics.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan waste-explore
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/diagnostics.json" diagnostics.json
          git add -- diagnostics.json
          git commit -m "Waste diagnostics $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin waste-explore
