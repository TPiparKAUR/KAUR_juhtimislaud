name: Waste analysis (from existing data)

# Re-runs the analysis on the Parquet files of an earlier "Waste data (aggregated)" run
# (artifact waste-agg) and publishes the aggregated waste.json to `waste-analysis`.
# Raw rows never leave the workflow artifact.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of a successful 'Waste data (aggregated)' run"
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: waste-analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Download raw data artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n waste-agg -D out/waste_agg
      - name: Analyse
        run: |
          uv run python run_waste.py --agg out/waste_agg/waste_agg.parquet \
            --log out/waste_agg/waste_fetch_log.json --out out/waste_agg
      - name: Publish aggregated results
        run: |
          cp out/waste_agg/waste.json "$RUNNER_TEMP/waste.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan waste-analysis
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/waste.json" waste.json
          git add -- waste.json
          git commit -m "Waste analysis $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin waste-analysis
