name: Tableau data catalogue

# Probes Tableau Public (profile + every known view) and the public side of tableau.envir.ee and
# records which data is reachable and its schema (columns, row counts).  No credentials are used.
# Results are force-pushed as one commit to the `catalog-results` branch; `main` stays clean.

on:
  workflow_dispatch:
    inputs:
      delay:
        description: "Seconds between requests"
        required: false
        default: "1.0"

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen

      - name: Collect inventories (baseline + latest crawl, if any)
        run: |
          mkdir -p out
          args=(--inventory data/kaur_viz_inventar.csv)
          if git show origin/crawl-results:kaur_viz_inventar.csv > out/crawl_inventar.csv 2>/dev/null; then
            args+=(--inventory out/crawl_inventar.csv)
          fi
          echo "ARGS=${args[*]}" >> "$GITHUB_ENV"

      - name: Probe
        env:
          DELAY: ${{ inputs.delay || '1.0' }}
        run: uv run python tableau_catalog.py $ARGS --out out --delay "$DELAY"

      - name: Summary
        run: |
          {
            echo "## Tableau catalogue"
            echo "- Views probed: $(($(wc -l < out/tableau_catalog.csv) - 1))"
            echo "- Views with CSV data: $(awk -F, 'NR>1 && $5==200' out/tableau_catalog.csv | wc -l)"
            echo "- Columns catalogued: $(($(wc -l < out/tableau_columns.csv) - 1))"
            echo '```json'; head -c 3000 out/tableau_probes.json; echo; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tableau-catalog
          path: out/
          retention-days: 90

      - name: Publish results to catalog-results branch
        run: |
          cp -r out "$RUNNER_TEMP/out"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan catalog-results
          git rm -rf --quiet .
          cp "$RUNNER_TEMP"/out/tableau_*.csv "$RUNNER_TEMP"/out/tableau_probes.json \
            "$RUNNER_TEMP"/out/profile_*.json .
          git add -- tableau_*.csv tableau_probes.json profile_*.json
          git commit -m "Tableau catalogue $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin catalog-results
