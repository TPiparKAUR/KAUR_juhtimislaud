name: Nature analysis (from existing data)

# Re-runs the analysis on the raw nature-conservation tables of an earlier "Nature data" run (artifact
# nature-raw) and publishes the aggregated nature.json to `nature-analysis`.
# Raw rows never leave the workflow artifact.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of a successful 'Nature data' run"
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: nature-analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Download raw data artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n nature-raw -D out/nature
      - name: Analyse
        run: uv run python run_nature.py --raw out/nature --out out/nature
      - name: Publish aggregated results
        run: |
          cp out/nature/nature.json "$RUNNER_TEMP/nature.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan nature-analysis
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/nature.json" nature.json
          git add -- nature.json
          git commit -m "Nature analysis $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin nature-analysis
