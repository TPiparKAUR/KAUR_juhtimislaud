name: Nature data

# Reads protected areas, Natura habitat/species statistics, species sites and woodland key
# habitats (7 tables, coordinates and free text excluded) and writes nature_diagnostics.json.
# The Parquet files stay in the artifact `nature-raw`; only the diagnostics go to `nature-explore`.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaur-api  # one job at a time against the shared public API
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python nature_fetch.py --out out/nature --workers 3
        timeout-minutes: 25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nature-raw
          path: out/nature/
          retention-days: 30
      - name: Publish diagnostics
        if: always()
        run: |
          cp out/nature/nature_diagnostics.json "$RUNNER_TEMP/nature_diagnostics.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan nature-explore
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/nature_diagnostics.json" nature_diagnostics.json
          git add -- nature_diagnostics.json
          git commit -m "Nature diagnostics $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin nature-explore
