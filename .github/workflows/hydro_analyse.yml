name: Hydrology analysis (from existing daily data)

# Re-runs the analysis on the daily Parquet of an earlier "Hydrology data (daily)" run, so analysis
# changes do not require another hour of downloading.  Publishes hydro.json to `hydro-analysis`.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of a successful 'Hydrology data (daily)' run (artifact hydro-daily)"
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: hydro-analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Download daily data artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n hydro-daily -D out/hydro
      - name: Catalogue and climate results
        run: |
          git show origin/hydro-results:hydro_catalog.json > hydro_catalog.json
          args=(--daily out/hydro/hydro_daily.parquet --catalog hydro_catalog.json --out out/hydro)
          if git show origin/climate-results:climate.json > climate.json 2>/dev/null; then
            args+=(--climate climate.json)
          fi
          uv run python run_hydro.py "${args[@]}"
      - name: Publish aggregated results to hydro-analysis branch
        run: |
          cp out/hydro/hydro.json "$RUNNER_TEMP/hydro.json"
          cp out/hydro/hydro_fetch_log.json "$RUNNER_TEMP/hydro_fetch_log.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan hydro-analysis
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/hydro.json" "$RUNNER_TEMP/hydro_fetch_log.json" .
          git add -- hydro.json hydro_fetch_log.json
          git commit -m "Hydrology analysis $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin hydro-analysis
