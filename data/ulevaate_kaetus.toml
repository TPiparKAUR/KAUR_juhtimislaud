# Coverage of KAUR's Tableau "Keskkonnaülevaade"/"Seire" views by this site (assessment by the
# analyst, 2026-10-06; to be confirmed by domain experts).  Key: `workbook` as in
# data/tableau_public_workbooks.csv.  meie = olemas | osaliselt | puudub.  `andmed` = where data for
# the missing/partial view could come from: "API:<table>" (named in the public API catalogue),
# "väline" (not in the KAUR API, e.g. Statistikaamet, Eurostat, EEA) or "teadmata".
# The Tableau views themselves could not be opened (no access to the hosts), so the descriptions
# below rest on view titles only.

